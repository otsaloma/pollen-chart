[project]
name = "pollen-chart"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "cdsapi>=0.7.6",
    # Since 2.0, Dataiter hard-requires PyArrow,
    # which pushes the Lambda size over 50 MB.
    "dataiter==1.0",
    "netCDF4>=1.7.2",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    # Lambda runtime botocore requirement
    "python-dateutil<3",
    "requests>=2.32.3",
    "xarray>=2025.4.0",
]

[dependency-groups]
dev = [
    # Provided by the Lambda runtime
    "boto3==1.38.18",
    "flake8>=7.2.0",
]
